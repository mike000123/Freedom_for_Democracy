{{ form.non_field_errors }}
{% for field in form %}
  <div class="form-row">
    {% if field.field.widget.input_type == "checkbox" %}
      <label for="{{ field.id_for_label }}" class="check">{{ field }} {{ field.label }}</label>
    {% else %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% if field.help_text %}<span class="note">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
